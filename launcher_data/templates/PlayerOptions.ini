; =============================================
; PlayerOptions.ini - CLEO Script Configuration
; =============================================
;
; INSTRUCTIONS:
; ------------
; 1. Change values below to customize your gameplay experience
; 2. Save the file and press F10 in-game to reload settings
; 3. No need to restart the game!
;
; VALUES EXPLAINED:
; ----------------
; - 0 = Disabled/No traffic or pedestrians
; - 0.5 = Half normal density
; - 1.0 = Normal/default game density
; - 2.0 = Double normal density
; - Values above 3.0 may cause performance issues

[Gameplay]
; Core gameplay options
; AutoAim: Emulates LCS/VCS-style aiming mechanics
; 0 = Disabled (manual aiming only)
; 1 = Enabled (auto-targeting when aiming) <- needs the specific script, located in the optionals folder
AutoAim=0 

[Density]
; Traffic and pedestrian density multipliers
; Adjust these values to control how many cars and people spawn in the world
; CarMultiplier: Affects vehicle traffic density
CarMultiplier=1.3

; PedMultiplier: Affects pedestrian density  
PedMultiplier=1.3

[Player]
; Player-specific options
; FreeResprays: Allows free car resprays at garages
; 0 = Disabled (normal cost applies)
; 1 = Enabled (resprays are free)
FreeResprays=1


[Debug]
; Debug and message settings
; ShowMessages: Controls whether script status messages appear on-screen
; 0 = No debug messages (clean gameplay)
; 1 = Show debug messages (useful for testing)
ShowMessages=0